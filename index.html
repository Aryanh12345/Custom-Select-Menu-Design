<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Custom Select Menu Design</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="Selector" id="box">
                <div id="selectField">
                    <p id="content">Select Social Media</p>
                    <img src="Logo/arrow.png" id="arrow">
                </div>
                <div class="option">
                    <div class="p">
                        <img src="Logo/facebook.png">
                        <p>Facebook</p>
                    </div>
                    <div class="p">
                        <img src="Logo/youtube.png">
                        <p>YouTube</p>
                    </div>
                    <div class="p">
                        <img src="Logo/instagram.png">
                        <p>Instagram</p>
                    </div>
                    <div class="p">
                        <img src="Logo/twitter.png">
                        <p>Twitter</p>
                    </div>
                    <div class="p">
                        <img src="Logo/pinterest.png">
                        <p>pinterest</p>
                    </div>
                    <div class="p">
                        <img src="Logo/whatsapp.png">
                        <p>Whatsapp</p>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
